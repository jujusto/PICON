name: Build Flutter test APK
on:
  push:
    branches:
      - main
      - "feat/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flutter-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-local-test-apk:
    name: Analyse, tests et APK locale
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: photo_app

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true
      - name: Télécharger les dépendances Flutter
        run: flutter pub get
      - name: Analyser le code Flutter
        run: flutter analyze
      - name: Exécuter les tests Flutter
        run: flutter test
      - name: Construire l’APK locale de test
        run: |
          flutter build apk \
            --debug \
            --flavor local \
            --target lib/main_local.dart \
            --dart-define=PICON_LOCAL_TEST=true \
            --dart-define=API_BASE_URL=http://127.0.0.1:8080/api
      - name: Publier l’APK comme artefact
        uses: actions/upload-artifact@v7
        with:
          name: picon-local-test-apk-${{ github.sha }}
          path: photo_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
