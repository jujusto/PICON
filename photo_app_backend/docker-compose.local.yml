name: picon-local

services:
  db:
    image: mysql:8.0
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: ${LOCAL_DB_PASSWORD:?Créez photo_app_backend/.env.local à partir de .env.local.example}
      MYSQL_DATABASE: picon_local
    volumes:
      - picon_local_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${LOCAL_DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - picon-local-network

  mailpit:
    image: axllent/mailpit:latest
    restart: "no"
    ports:
      - "127.0.0.1:8025:8025"
    networks:
      - picon-local-network

  backend:
    build: .
    restart: "no"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/picon_local?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${LOCAL_DB_PASSWORD:?Créez photo_app_backend/.env.local à partir de .env.local.example}
      STORAGE_LOCATION: /app/local-uploads
      JWT_SECRET_KEY: ${LOCAL_JWT_SECRET:?Créez photo_app_backend/.env.local à partir de .env.local.example}
      BACKEND_BASE_URL: ${PICON_LOCAL_PUBLIC_URL:?Définissez PICON_LOCAL_PUBLIC_URL dans .env.local}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      SINGLE_UPLOAD_MAX_FILE_SIZE: 25MB
    ports:
      - "${PICON_LOCAL_BIND_ADDRESS:-0.0.0.0}:${PICON_LOCAL_BACKEND_PORT:-8080}:8080"
    volumes:
      - ./local-uploads:/app/local-uploads
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - picon-local-network

networks:
  picon-local-network:
    driver: bridge

volumes:
  picon_local_mysql_data:
