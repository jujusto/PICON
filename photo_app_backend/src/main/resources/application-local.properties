# Profil réservé aux tests locaux. Les variables de docker-compose.local.yml
# remplacent ces valeurs ; aucune URL ni identifiant de production n’est requis.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/picon_local}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
storage.location=${STORAGE_LOCATION:./local-uploads}
backend.base-url=${BACKEND_BASE_URL:http://localhost:8080}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
